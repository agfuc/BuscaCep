<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Buscador de CEP</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
    <style>
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
      body {
        font-family: 'DM Sans', sans-serif;
        background-color: var(--bg, #f5f4f0);
        color: var(--text, #1a1a1a);
        min-height: 100vh;
        display: flex;
        flex-direction: column;
      }
      #root { flex: 1; }
      .footer {
        background-color: var(--bg-card, #ffffff);
        border-top: 1px solid rgba(0,0,0,0.08);
        padding: 32px 20px 0;
        margin-top: auto;
        font-family: 'DM Sans', sans-serif;
      }
      .footer-inner {
        max-width: 900px;
        margin: 0 auto;
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        gap: 40px;
        flex-wrap: wrap;
        padding-bottom: 28px;
      }
      .footer-inst {
        font-family: 'Syne', sans-serif;
        font-weight: 600;
        font-size: 0.95rem;
        color: var(--text, #1a1a1a);
        margin-bottom: 4px;
      }
      .footer-curso {
        font-size: 0.82rem;
        color: var(--text-muted, #6b6b6b);
        max-width: 340px;
        margin-bottom: 6px;
      }
      .footer-meta {
        display: flex;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
        font-size: 0.8rem;
        color: var(--text-muted, #6b6b6b);
      }
      .footer-meta .dot { opacity: 0.4; }
      .footer-right {
        display: flex;
        flex-direction: column;
        align-items: flex-end;
        gap: 14px;
      }
      .footer-nav { display: flex; gap: 20px; }
      .footer-nav a {
        font-size: 0.85rem;
        color: var(--text-muted, #6b6b6b);
        text-decoration: none;
        transition: color 0.25s;
      }
      .footer-nav a:hover { color: #5b4cf5; }
      .footer-social { display: flex; gap: 12px; }
      .footer-social a {
        color: var(--text-muted, #6b6b6b);
        transition: color 0.25s;
        display: flex;
        align-items: center;
      }
      .footer-social a:hover { color: #5b4cf5; }
      .footer-social svg { width: 20px; height: 20px; }
      .footer-bottom {
        border-top: 1px solid rgba(0,0,0,0.08);
        padding: 14px 0;
        text-align: center;
        font-size: 0.78rem;
        color: var(--text-muted, #6b6b6b);
        max-width: 900px;
        margin: 0 auto;
      }
      @media (max-width: 600px) {
        .footer-inner { flex-direction: column; gap: 24px; }
        .footer-right { align-items: flex-start; }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>

    <footer class="footer">
      <div class="footer-inner">
        <div class="footer-brand">
          <p class="footer-inst">Instituto Federal de Santa Catarina</p>
          <p class="footer-curso">Tecnologia em Analise e Desenvolvimento de Sistemas</p>
          <div class="footer-meta">
            <span>Alexandre Gustavo Fuck</span>
            <span class="dot">&#183;</span>
            <span>Matricula 202510703890</span>
            <span class="dot">&#183;</span>
            <span>Canoinhas &#8212; SC</span>
          </div>
        </div>

        <div class="footer-right">
          <div class="footer-nav">
            <a href="#home">Home</a>
            <a href="#servicos">Servicos</a>
            <a href="#numeros">Sobre</a>
          </div>
          <div class="footer-social">
            <a href="https://agfuc.github.io/BuscaCep/" target="_blank" rel="noopener" title="GitHub">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 19c-5 1.5-5-2.5-7-3m14 6v-3.87a3.37 3.37 0 0 0-.94-2.61c3.14-.35 6.44-1.54 6.44-7A5.44 5.44 0 0 0 20 4.77 5.07 5.07 0 0 0 19.91 1S18.73.65 16 2.48a13.38 13.38 0 0 0-7 0C6.27.65 5.09 1 5.09 1A5.07 5.07 0 0 0 5 4.77a5.44 5.44 0 0 0-1.5 3.78c0 5.42 3.3 6.61 6.44 7A3.37 3.37 0 0 0 9 18.13V22"/></svg>
            </a>
            <a href="https://youtu.be/QXsM0TeVh70"_blank" rel="noopener" title="YouTube">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M22.54 6.42a2.78 2.78 0 0 0-1.95-1.96C18.88 4 12 4 12 4s-6.88 0-8.59.46A2.78 2.78 0 0 0 1.46 6.42 29 29 0 0 0 1 12a29 29 0 0 0 .46 5.58A2.78 2.78 0 0 0 3.41 19.6C5.12 20 12 20 12 20s6.88 0 8.59-.46a2.78 2.78 0 0 0 1.95-1.95A29 29 0 0 0 23 12a29 29 0 0 0-.46-5.58z"/><polygon points="9.75 15.02 15.5 12 9.75 8.98 9.75 15.02"/></svg>
            </a>
            <a href="https://drive.google.com/drive/folders/1cOYtmL2Ixs2Nwx9-gWuagipYBWV-S7_L?usp=sharing" target="_blank" rel="noopener" title="Google Drive">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2 2 19h7.5L12 2z"/><path d="M12 2l4.5 7.5H22L12 2z"/><path d="M9.5 19H22l-5.5-9.5"/><path d="M2 19l5.5-9.5"/></svg>
            </a>
          </div>
        </div>
      </div>
      <div class="footer-bottom">
        <span>&#169; 2025 IFSC &#8212; Buscador de CEP</span>
      </div>
    </footer>
  </body>
</html>
